name: Build CodeDroid APK

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm install @capacitor/core
          npm install @capacitor/cli
          npm install @capacitor/android

      - name: Install Capacitor Assets
        run: npm install @capacitor/assets --save-dev

      - name: Install Splash Screen Plugin
        run: npm install @capacitor/splash-screen

      - name: Install Filesystem Plugin
        run: npm install @capacitor/filesystem

      - name: Install File Picker Plugin
        run: npm install @capawesome/capacitor-file-picker

      - name: Prepare Web Files
        run: |
          mkdir -p www
          cp index.html www/
          mkdir -p www/style www/logic www/assets
          cp style/app.css    www/style/
          cp style/editor.css www/style/
          cp style/monokai.css www/style/
          cp logic/native.js  www/logic/
          cp logic/storage.js www/logic/
          cp logic/files.js   www/logic/
          cp logic/editor.js  www/logic/
          cp logic/console.js www/logic/
          cp logic/preview.js www/logic/
          cp logic/app.js     www/logic/
          cp assets/icon.svg  www/assets/

      - name: Create Capacitor Config
        run: |
          echo '{
            "appId": "dev.codedroid.app",
            "appName": "CodeDroid",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1500,
                "backgroundColor": "#2d0a38",
                "splashFullScreen": true,
                "splashImmersive": true
              },
              "Filesystem": {
                "iosScheme": "ionic"
              }
            }
          }' > capacitor.config.json

      - name: Initialize Capacitor
        run: npx cap init CodeDroid dev.codedroid.app --web-dir www

      - name: Add Android Platform
        run: npx cap add android

      - name: Prepare Icon Resources
        run: |
          echo "✅ Menggunakan icon.png dari resources/"
          ls -lh resources/

      - name: Generate Android Icons and Splash Screen
        run: npx capacitor-assets generate --assetPath resources

      - name: Set App Theme (Dark Monokai)
        run: |
          # Set status bar and navigation bar color to match Monokai dark
          COLORS_FILE="android/app/src/main/res/values/colors.xml"
          cat > $COLORS_FILE << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#272822</color>
              <color name="colorPrimaryDark">#1e1f1c</color>
              <color name="colorAccent">#F92672</color>
          </resources>
          EOF

          # Update styles untuk dark theme tapi tetap pertahankan style Capacitor
          STYLES_FILE="android/app/src/main/res/values/styles.xml"
          cat > $STYLES_FILE << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- Base theme -->
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="colorPrimary">@color/colorPrimary</item>
                  <item name="colorPrimaryDark">@color/colorPrimaryDark</item>
                  <item name="colorAccent">@color/colorAccent</item>
                  <item name="android:windowBackground">@color/colorPrimary</item>
                  <item name="android:statusBarColor">@color/colorPrimaryDark</item>
                  <item name="android:navigationBarColor">@color/colorPrimaryDark</item>
              </style>
              <!-- Capacitor splash screen theme — WAJIB ADA -->
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="android:background">@color/colorPrimary</item>
              </style>
          </resources>
          EOF

      - name: Allow File Access in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <application|' $MANIFEST

      - name: Register FilePicker Plugin in MainActivity
        run: |
          MAIN="android/app/src/main/java/dev/codedroid/app/MainActivity.java"
          cat > $MAIN << 'JAVAEOF'
          package dev.codedroid.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import io.capawesome.capacitorjs.plugins.filepicker.FilePickerPlugin;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(FilePickerPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVAEOF

      - name: Sync Android
        run: npx cap sync android

      - name: Decode Keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/codedroid.jks

      # ── Build DEBUG (non-tag push) — tidak perlu keystore ──────────────
      - name: Build APK (non-tag push)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Build Artifact (non-tag push)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: CodeDroid-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # ── Build RELEASE (tag v*.*.*) ────────────────────────────────────
      - name: Build Release APK (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          # Kalau keystore secrets sudah diisi, build release signed
          # Kalau belum, build debug saja
          if [ -f "app/codedroid.jks" ] && [ -n "$STORE_PASSWORD" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$PWD/app/codedroid.jks \
              -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk ../CodeDroid-release.apk
          else
            echo "⚠️ Keystore tidak ditemukan, build debug APK..."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../CodeDroid-release.apk
          fi

      - name: Rename APK (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          cp CodeDroid-release.apk CodeDroid-v${VERSION}.apk

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: CodeDroid ${{ github.ref_name }}
          body: |
            ## CodeDroid – Mobile Code Editor

            Editor kode HTML/CSS/JS langsung di HP kamu 📱

            ### ✨ Fitur
            - 🎨 Syntax highlighting tema Monokai
            - 👁️ Live preview HTML/CSS/JS
            - 🖥️ Console terintegrasi
            - 📁 Buka folder dari storage device (tulis balik otomatis)
            - 💾 Simpan langsung ke file asli di device
            - ⌨️ Quick toolbar untuk simbol coding
            - 🌙 Dark mode penuh
            - 🔄 Auto-save ke IndexedDB + file asli sekaligus

            ### 📥 Cara Install
            1. Download file **CodeDroid-v*.apk** di bawah
            2. Buka file APK di HP
            3. Izinkan "Install dari sumber tidak dikenal" jika diminta
            4. Install selesai — selamat coding! 🚀

            ### 🔐 GitHub Secrets yang Dibutuhkan
            - `KEYSTORE_BASE64` — Keystore ter-encode base64
            - `STORE_PASSWORD` — Password keystore
            - `KEY_ALIAS` — Alias key
            - `KEY_PASSWORD` — Password key
          files: CodeDroid-v*.apk
          draft: true
          prerelease: false
