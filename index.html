<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CodeDroid - Mobile Code Editor</title>
  <link rel="stylesheet" href="style/app.css" />
  <link rel="stylesheet" href="style/editor.css" />
  <link rel="stylesheet" href="style/monokai.css" />
  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/theme/monokai.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/comment/comment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/fold/foldcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/fold/foldgutter.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/fold/brace-fold.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/fold/xml-fold.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/fold/indent-fold.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/selection/active-line.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.17/addon/fold/foldgutter.min.css" />
</head>
<body>

<!-- ===== SPLASH SCREEN ===== -->
<div id="splash">
  <div class="splash-logo">
    <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="120" rx="24" fill="#4a0e5c"/>
      <!-- < -->
      <polyline points="28,38 12,55 28,72" stroke="#7c6fcd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- / -->
      <line x1="52" y1="75" x2="68" y2="35" stroke="#e02020" stroke-width="7" stroke-linecap="round"/>
      <!-- > -->
      <polyline points="92,38 108,55 92,72" stroke="#f0f0f0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span>CodeDroid</span>
  </div>
  <div class="splash-sub">Mobile Code Editor</div>
</div>

<!-- ===== APP SHELL ===== -->
<div id="app" class="hidden">

  <!-- TOP BAR -->
  <header class="topbar">
    <button class="topbar-btn" id="btnSidebar" title="File Manager">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    </button>
    <div class="topbar-title">
      <span id="currentFileName">untitled.html</span>
      <span id="dirtyDot" class="dirty-dot hidden">●</span>
    </div>
    <div class="topbar-actions">
      <button class="topbar-btn" id="btnRun" title="Jalankan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="topbar-btn" id="btnSave" title="Simpan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>
      </button>
      <button class="topbar-btn" id="btnMore" title="Lainnya">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
    </div>
  </header>

  <!-- FILE TABS -->
  <div class="tab-bar" id="tabBar">
    <!-- tabs generated by JS -->
    <button class="tab-new-btn" id="btnNewTab" title="Tab baru">+</button>
  </div>

  <!-- LANG TABS (HTML/CSS/JS) -->
  <div class="lang-tabs" id="langTabs">
    <button class="lang-tab active" data-lang="html">HTML</button>
    <button class="lang-tab" data-lang="css">CSS</button>
    <button class="lang-tab" data-lang="js">JS</button>
  </div>

  <!-- MAIN AREA -->
  <main class="main-area">
    <!-- EDITOR PANE -->
    <div class="pane editor-pane" id="editorPane">
      <div id="editorContainer"></div>
    </div>

    <!-- DIVIDER -->
    <div class="pane-divider" id="paneDivider">
      <div class="divider-handle"></div>
    </div>

    <!-- PREVIEW + CONSOLE PANE -->
    <div class="pane right-pane" id="rightPane">
      <!-- Preview -->
      <div class="preview-area" id="previewArea">
        <div class="preview-topbar">
          <span class="preview-label">Preview</span>
          <div class="preview-actions">
            <button class="preview-btn" id="btnRefreshPreview" title="Refresh">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
            <button class="preview-btn" id="btnFullPreview" title="Fullscreen">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </button>
          </div>
        </div>
        <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin allow-forms" title="Preview"></iframe>
      </div>

      <!-- Console -->
      <div class="console-area" id="consoleArea">
        <div class="console-topbar">
          <span class="console-label">Console</span>
          <div class="console-actions">
            <span class="console-count" id="consoleCount"></span>
            <button class="preview-btn" id="btnClearConsole" title="Bersihkan">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
            </button>
            <button class="preview-btn" id="btnToggleConsole" title="Toggle">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>
        </div>
        <div class="console-output" id="consoleOutput"></div>
        <div class="console-input-row">
          <span class="console-prompt">&gt;</span>
          <input type="text" id="consoleInput" class="console-input" placeholder="Jalankan ekspresi..." spellcheck="false" autocomplete="off" />
        </div>
      </div>
    </div>
  </main>

  <!-- TOOLBAR (Quick Keys) -->
  <div class="quick-toolbar" id="quickToolbar">
    <button class="qtbtn" data-insert="  ">⇥</button>
    <button class="qtbtn" data-insert="{">{ </button>
    <button class="qtbtn" data-insert="}">}</button>
    <button class="qtbtn" data-insert="[">[</button>
    <button class="qtbtn" data-insert="]">]</button>
    <button class="qtbtn" data-insert="("> ( </button>
    <button class="qtbtn" data-insert=")">)</button>
    <button class="qtbtn" data-insert=";">;  </button>
    <button class="qtbtn" data-insert=":">&nbsp;:&nbsp;</button>
    <button class="qtbtn" data-insert='"'>"</button>
    <button class="qtbtn" data-insert="'">'</button>
    <button class="qtbtn" data-insert="=">=</button>
    <button class="qtbtn" data-insert="<">&lt;</button>
    <button class="qtbtn" data-insert=">">&gt;</button>
    <button class="qtbtn" data-insert="/">/</button>
    <button class="qtbtn qtbtn-action" id="qtUndo">↩</button>
    <button class="qtbtn qtbtn-action" id="qtRedo">↪</button>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="editor" id="navEditor">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      <span>Editor</span>
    </button>
    <button class="nav-btn" data-view="preview" id="navPreview">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>Preview</span>
    </button>
    <button class="nav-btn" data-view="console" id="navConsole">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      <span>Console</span>
    </button>
    <button class="nav-btn" data-view="files" id="navFiles">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span>Files</span>
    </button>
  </nav>
</div>

<!-- ===== FILE MANAGER SIDEBAR ===== -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">📁 File Manager</span>
    <button class="sidebar-close" id="btnCloseSidebar">✕</button>
  </div>
  <div class="sidebar-actions">
    <button class="sb-btn" id="btnNewFile">＋ File</button>
    <button class="sb-btn" id="btnNewFolder">＋ Folder</button>
    <button class="sb-btn sb-btn-import" id="btnImportFile">📄 Buka File</button>
    <button class="sb-btn sb-btn-folder" id="btnOpenFolder">📁 Buka Folder</button>
    <button class="sb-btn sb-btn-export" id="btnExportFile" style="grid-column:span 2">💾 Export</button>
  </div>
  <div class="sidebar-tree" id="sidebarTree"></div>
</aside>

<!-- ===== MODALS ===== -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-title" id="modalTitle">Input</div>
    <input type="text" class="modal-input" id="modalInput" />
    <div class="modal-actions">
      <button class="modal-btn modal-cancel" id="modalCancel">Batal</button>
      <button class="modal-btn modal-ok" id="modalOk">OK</button>
    </div>
  </div>
</div>

<!-- CONTEXT MENU -->
<div class="ctx-menu hidden" id="ctxMenu">
  <button class="ctx-item" id="ctxRename">✏️ Rename</button>
  <button class="ctx-item" id="ctxDelete">🗑️ Hapus</button>
  <button class="ctx-item" id="ctxDownload">⬇️ Download</button>
</div>

<!-- MORE MENU -->
<div class="ctx-menu hidden" id="moreMenu">
  <button class="ctx-item" id="menuFormat">🎨 Format Kode</button>
  <button class="ctx-item" id="menuDuplicate">📋 Duplikat Tab</button>
  <button class="ctx-item" id="menuDownload">⬇️ Download File</button>
  <button class="ctx-item" id="menuImport">📂 Import File</button>
  <button class="ctx-item" id="menuSettings">⚙️ Pengaturan</button>
</div>

<!-- SETTINGS PANEL -->
<div class="modal-overlay hidden" id="settingsOverlay">
  <div class="modal settings-modal">
    <div class="modal-title">⚙️ Pengaturan</div>
    <div class="settings-body">
      <div class="setting-row">
        <label>Font Size</label>
        <div class="setting-control">
          <button class="sz-btn" id="szDown">−</button>
          <span id="szVal">14</span>px
          <button class="sz-btn" id="szUp">+</button>
        </div>
      </div>
      <div class="setting-row">
        <label>Line Numbers</label>
        <label class="toggle"><input type="checkbox" id="togLineNum" checked/><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <label>Word Wrap</label>
        <label class="toggle"><input type="checkbox" id="togWrap"/><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <label>Auto Preview</label>
        <label class="toggle"><input type="checkbox" id="togAutoPreview" checked/><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <label>Tab Size</label>
        <select id="selTabSize" class="setting-select">
          <option value="2">2 spasi</option>
          <option value="4" selected>4 spasi</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn modal-ok" id="settingsClose">Tutup</button>
    </div>
  </div>
</div>

<!-- hidden file input -->
<input type="file" id="fileInput" accept=".html,.css,.js,.txt,.json,.md,.xml,.svg" style="display:none" multiple />
<input type="file" id="folderInput" webkitdirectory multiple style="display:none" />

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="logic/native.js"></script>
<script src="logic/storage.js"></script>
<script src="logic/files.js"></script>
<script src="logic/editor.js"></script>
<script src="logic/console.js"></script>
<script src="logic/preview.js"></script>
<script src="logic/app.js"></script>
</body>
</html>
